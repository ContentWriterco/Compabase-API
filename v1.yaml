      - Usage
      summary: Monthly quota usage for this API key
      description: 'Returns how many requests this key has used in the current UTC calendar month against its limit.

        This endpoint does not consume quota (usage counter is not incremented).

        '
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          description: Usage snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                - used
                - limit
                - remaining
                - monthUtc
                - resetsAtUtc
                properties:
                  used:
                    type: integer
                  limit:
                    type: integer
                  remaining:
                    type: integer
                  monthUtc:
                    type: string
                    description: Current billing period date (ISO 8601 date).
                    example: '2026-08-31'
                  resetsAtUtc:
                    type: string
                    format: date-time
                    description: When the billing period resets (ISO 8601 datetime with timezone).
                    example: '2026-09-01T00:00:00+00:00'
              example:
                used: 1240
                limit: 10000
                remaining: 8760
                monthUtc: "2026-10-28"
                resetsAtUtc: '2026-11-27T10:35:13.734189+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
webhooks:
  watchlistEvent:
    post:
      tags:
      - Watchlist
      summary: Watchlist change event
      description: |
        Sent to the webhook URL configured in the portal (Settings → Notifications) or with the MCP tool
        `set_webhook_url`, for every company on your watchlist that changes. Choose which event types
        you receive in the same settings (default: all).

        **Signature:** header `X-Compabase-Signature: t=<unix>,v1=<hex>`, where `v1` is
        HMAC-SHA256 of the raw request body with your webhook secret.
        Respond with any 2xx within 10 seconds; failed deliveries are retried.
      parameters:
      - name: X-Compabase-Event
        in: header
        required: true
        description: Event type, same as `event` in the body.
        schema:
          type: string
        example: watchlist.board_changed
      - name: X-Compabase-Signature
        in: header
        required: true
        description: '`t=<unix timestamp>,v1=<HMAC-SHA256 hex of the raw body>`'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistWebhookEvent'
            example:
              event: watchlist.board_changed
              company:
                entity_id: ad2ae683-ccbd-49c6-a85c-648024435cb5
                name: Orlen S.A.
                krs: '0000028860'
                nip: '7740001454'
                city: Płock
                is_active: true
                revenue_total: 372000000000
                profit_net: 5600000000
              detected_at: '2026-11-11T07:30:00Z'
      responses:
        '200':
          description: Delivery accepted. Any 2xx response is treated as success.
components:
  headers:
    X-RateLimit-Limit:
      description: Requests allowed per minute for this API key.
      schema:
        type: integer
      example: 120
    X-RateLimit-Remaining:
      description: Requests left in the current one-minute window.
      schema:
        type: integer
      example: 117
    X-RateLimit-Reset:
      description: Seconds until the current one-minute window resets.
      schema:
        type: integer
      example: 42
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
      example: 30
  responses:
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidKrs:
              summary: Invalid KRS value
              value:
                statusCode: 400
                statusMessage: Invalid krs
                message: Invalid krs
                data:
                  error:
                    code: INVALID_KRS
                    message: After normalization, KRS must contain exactly 10 digits.
                    details:
                      parameter: krs
            invalidCursor:
              summary: Invalid cursor format
              value:
                statusCode: 400
                statusMessage: Invalid cursor
                message: Invalid cursor
                data:
                  error:
                    code: INVALID_CURSOR
                    message: Cursor must be a valid UUID.
                    details:
                      parameter: cursor
            invalidRange:
              summary: Invalid numeric range
              value:
                statusCode: 400
                statusMessage: Invalid range
                message: Invalid range
                data:
                  error:
                    code: INVALID_RANGE
                    message: revenue_min cannot be greater than revenue_max.
                    details:
                      parameter: revenue_min,revenue_max
    Unauthorized:
      description: Missing, invalid, or revoked API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            statusMessage: Unauthorized
            message: Unauthorized
            data:
              message: Missing or invalid API key.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            statusMessage: Not Found
            message: Not Found
            data:
              error:
                code: NOT_FOUND
                message: Company not found.
    TooManyRequests:
      description: |
        Rate limit (120 requests per minute per key) or monthly quota exceeded.
        `Retry-After` says how many seconds to wait before retrying.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 429
            statusMessage: Too Many Requests
            message: Too Many Requests
            data:
              error:
                code: QUOTA_EXCEEDED
                message: Monthly quota exceeded for this API key.
  schemas:
    WatchlistWebhookEvent:
      type: object
      description: Payload POSTed to your webhook URL when a watched company changes.
      required:
      - event
      - company
      - detected_at
      properties:
        event:
          type: string
          description: Event type (also sent in the `X-Compabase-Event` header).
          enum:
          - watchlist.company_changed
          - watchlist.board_changed
          - watchlist.ownership_changed
          - watchlist.status_changed
          - watchlist.company_removed_from_registry
          - watchlist.financials_updated
          - watchlist.filing_overdue
          - watchlist.insolvency
          - watchlist.court_gazette
          - watchlist.secured_liabilities
          - watchlist.sanctions
          - watchlist.public_tenders
          - watchlist.public_aid
          - watchlist.licenses
          - watchlist.nfz
          - watchlist.trademarks
          - watchlist.job_offers
          - watchlist.contact_changed
          - watchlist.company_news
        company:
          type: object
          properties:
            entity_id:
              type:
              - string
              - 'null'
              format: uuid
            name:
              type:
              - string
              - 'null'
            krs:
              type:
              - string
              - 'null'
            nip:
              type:
              - string
              - 'null'
            city:
              type:
              - string
              - 'null'
            is_active:
              type:
              - boolean
              - 'null'
            revenue_total:
              type:
              - number
              - 'null'
            profit_net:
              type:
              - number
              - 'null'
        detected_at:
          type: string
          format: date-time
        changes:
          type: array
          description: Field-level changes, when the event has them.
          items:
            type: object
            properties:
              field:
                type: string
              label:
                type: string
              old_value: {}
              new_value: {}
        registry:
          type: string
          description: Source register for registry events (e.g. KRZ, MSiG, BZP).
        delta:
          type: number
          description: Change of the register counter for registry events.
        filing:
          type: object
          description: Newly filed financial statement (financials_updated).
        news:
          type: array
          description: Newest articles (company_news).
          items:
            type: object
    ErrorResponse:
      type: object
      required:
      - statusCode
      - statusMessage
      - message
      properties:
        statusCode:
          type: integer
          description: HTTP status code.
        statusMessage:
          type: string
          description: HTTP status text.
        message:
          type: string
          description: Short error summary (same as statusMessage for most errors).
        data:
          type: object
          description: Domain error payload set by the handler.
          properties:
            message:
              type: string
              description: Human-readable message (used by 401 responses).
            error:
              type: object
              description: Structured domain error (used by 400/404/429 responses).
              properties:
                code:
                  type: string
                  description: Machine-readable domain error code.
                  enum:
                  - INVALID_KRS
                  - INVALID_NIP
                  - INVALID_CURSOR
                  - INVALID_RANGE
                  - INVALID_PARAMETER
                  - CONFLICTING_PARAMETERS
                  - INVALID_BOOLEAN
                  - INVALID_KEYWORDS
                  - INVALID_API_KEY
                  - UNAUTHORIZED
                  - NOT_FOUND
                  - QUOTA_EXCEEDED
                message:
                  type: string
                details:
                  type: object
                  additionalProperties: true
    CompanyListPagination:
      type: object
      required:
      - limit
      - offset
      - total
      - hasMore
      properties:
        limit:
          type: integer
          description: Page size (capped at 100 for `GET /companies`; up to 500 for `GET /companies/export`).
        offset:
          type: integer
        total:
          type: integer
          description: Total rows matching filters. May be `-1` when not computed (e.g. some cursor-based responses).
        hasMore:
