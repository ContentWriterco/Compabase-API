  /companies/krs/{krs}/sanctions:
    get:
      tags:
      - Registers
      summary: MSWiA sanctions listing
      description: |
        Official Polish Ministry of the Interior and Administration (MSWiA) sanctions listing
        for a KRS company matched by KRS, NIP, or REGON.

        `sanctions` is `null` when the company is not on the list. When present, `entries`
        include the name on the list, listed and removed dates, restrictive measures, and
        the legal grounds. Polish text stays in `measures` / `justification`; English and
        German are in `measures_i18n` / `justification_i18n`.
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: krs
        in: path
        required: true
        schema:
          type: string
        description: KRS input is normalized by stripping non-digits and left-padding to 10 digits.
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          description: Sanctions payload. `sanctions` is null when the company is not listed.
          content:
            application/json:
              schema:
                type: object
                required: [krs, entity_id]
                properties:
                  krs:
                    type: string
                  entity_id:
                    type: string
                    format: uuid
                  sanctions:
                    nullable: true
                    type: object
                    properties:
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            source:
                              type: string
                              example: pl_mswia
                            name:
                              type: string
                            measures:
                              type: string
                              nullable: true
                              description: Restrictive measures, Polish source text. Lettered items are separated by newlines.
                            justification:
                              type: string
                              nullable: true
                              description: Legal grounds, Polish source text. Paragraphs are separated by a blank line.
                            measures_i18n:
                              type: object
                              nullable: true
                              properties:
                                en:
                                  type: string
                                de:
                                  type: string
                            justification_i18n:
                              type: object
                              nullable: true
                              properties:
                                en:
                                  type: string
                                de:
                                  type: string
                            listed_on:
                              type: string
                              format: date
                              nullable: true
                            removed_on:
                              type: string
                              format: date
                              nullable: true
                            source_url:
                              type: string
                              nullable: true
              example:
                krs: "0000795863"
                entity_id: 58142114-9193-42c0-a7e3-1ed189327f2e
                sanctions:
                  entries:
                  - source: pl_mswia
                    name: EUROCHEM POLSKA Sp. z o.o.
                    listed_on: "2022-04-26"
                    removed_on: null
                    source_url: https://www.gov.pl/web/mswia/lista-osob-i-podmiotow-objetych-sankcjami
                    measures: 'a. zamrożenie wszystkich środków finansowych i zasobów gospodarczych,
              
                      b. zakaz udostępniania podmiotowi wpisanemu na listę – bezpośrednio…'
                    justification: A. Melniczenko jest rosyjskim przemysłowcem, właścicielem przedsiębiorstwa EuroChem, będącego
                      jednym z głównych producentów nawozów i prz…
                    measures_i18n:
                      en: 'a. freezing of all funds and economic resources,
              
                        b. prohibition on making available to the listed entity – directly or indirectly – any f…'
                      de: 'a. Einfrieren aller Gelder und wirtschaftlichen Ressourcen,
              
                        b. Verbot der unmittelbaren oder mittelbaren Bereitstellung jeglicher Gelder…'
                    justification_i18n:
                      en: A. Melniczenko is a Russian industrialist and the owner of EuroChem, one of the main fertiliser producers,
                        and the coal company SUEK. He…
                      de: A. Melniczenko ist ein russischer Industrieller und Eigentümer von EuroChem, einem der wichtigsten Düngemittelhersteller,
                        sowie des Kohle…
