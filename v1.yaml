  /watchlist:
    get:
      tags:
      - Watchlist
      summary: List watchlist
      description: |
        Lists companies on the watchlist of the **user account linked to the API key**.
        Requires `user_id` on the key.
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Watchlist page.
          content:
            application/json:
              schema:
                type: object
              example:
                data: []
                pagination:
                  total: 0
                  hasMore: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: API key is not linked to a user account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /watchlist/krs/{krs}:
    post:
      tags:
      - Watchlist
      summary: Add company to watchlist
      description: |
        Adds a company to the **watchlist of the user account linked to the API key**.

        The company is identified by **KRS** (Polish court registry number). Digits only;
        leading zeros are optional (normalized to 10 digits server-side).

        If the company is already on the watchlist, the response returns `already_following: true`
        and does not create a duplicate entry.

        Requires an API key associated with a Compabase portal user account (`user_id` on the key).
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: krs
        in: path
        required: true
        schema:
          type: string
        description: KRS input is normalized by stripping non-digits and left-padding to 10 digits.
          After normalization, KRS must contain exactly 10 digits; otherwise request fails with `400 INVALID_KRS`.
        example: "0000028860"
      responses:
        '200':
          description: Company added to watchlist (or already followed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistAddResponse'
              examples:
                added:
                  summary: Newly added
                  value:
                    krs: "0000028860"
                    entity_id: ad2ae683-ccbd-49c6-a85c-648024435cb5
                    already_following: false
                    created_at: "2026-05-20T14:30:00Z"
                alreadyFollowing:
                  summary: Already on watchlist
                  value:
                    krs: "0000028860"
                    entity_id: ad2ae683-ccbd-49c6-a85c-648024435cb5
                    already_following: true
                    created_at: "2026-05-15T09:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: API key is not linked to a user account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_API_KEY
                  message: This API key is not linked to a user account.
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
      - Watchlist
      summary: Remove company from watchlist
      description: |
        Removes a KRS company from the watchlist of the user linked to the API key.
        Idempotent: `removed: false` when the company was not on the list.
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: krs
        in: path
        required: true
        schema:
          type: string
        example: "0000028860"
      responses:
        '200':
          description: Removal result.
          content:
            application/json:
              schema:
                type: object
              example:
                krs: "0000028860"
                entity_id: ad2ae683-ccbd-49c6-a85c-648024435cb5
                removed: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: API key is not linked to a user account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /persons/search:
    get:
      tags:
      - Persons
      summary: Search persons by name
      description: |
        Searches for natural persons by name (first name, last name, or both).
        Returns a deduplicated list of matching persons with their `person_id` key
        and the number of companies they are linked to.

        Use the returned `person_id` with `GET /persons/{personId}/connections`
        to fetch full connection details.

        Identification is restricted to name-based queries (first name, last name, or both).
        Protected data, including PESEL and exact birth dates, is never exposed.
        To assist with identification, every result includes a `birth_year` (integer).

        **Result capping:** internally the search scans up to 2 000 matching link
        rows before aggregation. For very common names the response may include
        a `note` field indicating the result set was truncated; use a more specific
        query to narrow results.
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
        description: |
          Name substring to search for (case-insensitive). Must be at least
          **2 characters**. Matched against the stored display name using
          `ILIKE %q%`.
        example: Kowalski
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
        description: 'Maximum number of persons to return. Capped at **50**.'
      responses:
        '200':
          description: List of matching persons.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - total
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonSearchItem'
                  total:
                    type: integer
                    description: Number of distinct persons found (before `limit` slicing).
                  note:
                    type: string
                    nullable: true
                    description: Present when the internal scan limit was reached and results may be incomplete.
              example:
                data:
                - person_id: 033e6964-179b-4039-86a2-0e0590c56918
                  display_name: Krzysztof Mateusz Kowalski
                  birth_year: 1985
                  company_count: 3
                - person_id: 0063e9c1-265f-47d4-a3ad-6cb698869f7a
                  display_name: Sebastian Piotr Kowalski
                  birth_year: null
                  company_count: 2
                - person_id: 048bd9e8-8b0e-446f-8b36-e60f518d3abe
                  display_name: Henry Kowalski
                  birth_year: 1972
                  company_count: 1
                total: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /persons/{personId}/connections:
    get:
      tags:
      - Persons
      summary: Company connections for a person
      description: |
        Returns all companies linked to the given person together with the
        relationship type and role label for each link.

        Use `GET /persons/search` to resolve a name to a `person_id` first.
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID of the person; obtained from `GET /persons/search`.
        example: 033e6964-179b-4039-86a2-0e0590c56918
      responses:
        '200':
          description: Person connections payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonConnectionsResponse'
              example:
                person_id: 033e6964-179b-4039-86a2-0e0590c56918
                companies:
                - entity_id: 1a2b3c4d-0000-0000-0000-000000000001
                  registry_number: '0000123456'
                  company_name: Example Company Ltd.
                  relationships:
                  - kind: management
                    role: President of the Management Board
                - entity_id: 1a2b3c4d-0000-0000-0000-000000000002
                  registry_number: '0000654321'
                  company_name: Second Company Ltd.
                  relationships:
                  - kind: ownership
                    role: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /usage:
    get:
      tags:
      - Usage
      summary: Monthly quota usage for this API key
      description: 'Returns how many requests this key has used in the current UTC calendar month against its limit.

        This endpoint does not consume quota (usage counter is not incremented).

        '
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Usage snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                - used
                - limit
                - remaining
                - monthUtc
                - resetsAtUtc
                properties:
                  used:
                    type: integer
                  limit:
                    type: integer
                  remaining:
                    type: integer
                  monthUtc:
                    type: string
                    description: Current billing period date (ISO 8601 date).
                    example: '2026-08-31'
                  resetsAtUtc:
                    type: string
                    format: date-time
                    description: When the billing period resets (ISO 8601 datetime with timezone).
                    example: '2026-09-01T00:00:00+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidKrs:
              summary: Invalid KRS value
              value:
                statusCode: 400
                statusMessage: Invalid krs
                message: Invalid krs
                data:
                  error:
                    code: INVALID_KRS
                    message: After normalization, KRS must contain exactly 10 digits.
                    details:
                      parameter: krs
            invalidCursor:
              summary: Invalid cursor format
              value:
                statusCode: 400
                statusMessage: Invalid cursor
                message: Invalid cursor
                data:
                  error:
                    code: INVALID_CURSOR
                    message: Cursor must be a valid UUID.
                    details:
                      parameter: cursor
            invalidRange:
              summary: Invalid numeric range
              value:
                statusCode: 400
                statusMessage: Invalid range
                message: Invalid range
                data:
                  error:
                    code: INVALID_RANGE
                    message: revenue_min cannot be greater than revenue_max.
                    details:
                      parameter: revenue_min,revenue_max
    Unauthorized:
      description: Missing, invalid, or revoked API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            statusMessage: Unauthorized
            message: Unauthorized
            data:
              message: Missing or invalid API key.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            statusMessage: Not Found
            message: Not Found
            data:
              error:
                code: NOT_FOUND
                message: Company not found.
    TooManyRequests:
      description: Monthly quota exceeded for this API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 429
            statusMessage: Too Many Requests
            message: Too Many Requests
            data:
              error:
                code: QUOTA_EXCEEDED
                message: Monthly quota exceeded for this API key.
  schemas:
    ErrorResponse:
      type: object
      required:
      - statusCode
      - statusMessage
      - message
      properties:
        statusCode:
          type: integer
          description: HTTP status code.
        statusMessage:
          type: string
          description: HTTP status text.
        message:
          type: string
          description: Short error summary (same as statusMessage for most errors).
        data:
          type: object
          description: Domain error payload set by the handler.
          properties:
            message:
              type: string
              description: Human-readable message (used by 401 responses).
            error:
              type: object
              description: Structured domain error (used by 400/404/429 responses).
              properties:
                code:
                  type: string
                  description: Machine-readable domain error code.
                  enum:
                  - INVALID_KRS
                  - INVALID_NIP
                  - INVALID_CURSOR
                  - INVALID_RANGE
                  - INVALID_PARAMETER
                  - CONFLICTING_PARAMETERS
                  - INVALID_BOOLEAN
                  - INVALID_KEYWORDS
                  - INVALID_API_KEY
                  - UNAUTHORIZED
                  - NOT_FOUND
                  - QUOTA_EXCEEDED
                message:
                  type: string
                details:
                  type: object
                  additionalProperties: true
    CompanyListPagination:
      type: object
      required:
      - limit
      - offset
      - total
      - hasMore
      properties:
        limit:
          type: integer
          description: Page size (capped at 100 for `GET /companies`; up to 500 for `GET /companies/export`).
        offset:
          type: integer
        total:
          type: integer
          description: Total rows matching filters. May be `-1` when not computed (e.g. some cursor-based responses).
        hasMore:
          type: boolean
        cursor:
          type: string
          description: Last `entity_id` from this page; pass as `cursor` query param for the next page when supported.
    CompanyListItem:
      type: object
      description: 'Row from `company_search` (fields depend on query path) plus enrichment: `email`, `website`, `logo_url`,

        `currency`, `period_to`, and normalized `company_name_display`. `full_address` is derived from postal data when present.

        '
