  /companies/krs/{krs}/gpw:
    get:
      tags:
      - Companies
      summary: Warsaw Stock Exchange (GPW)
      description: |
        Listing snapshot for a KRS company matched to GPW Main Market, NewConnect, or GlobalConnect:
        ticker, ISIN, last close and change, market cap, shares, EPS, P/E, dividend and yield,
        plus a few recent daily bars. Quotes delayed ~15 minutes, in PLN.

        Not an official GPW licensed feed. `gpw` is `null` when the company is not listed / not matched.

        Optional history (still capped – never the full MAX chart):
        - `include=series` – daily OHLCV, default 250 bars, max 2000 (`series_limit`)
        - `include=intraday` – 1-minute bars for the last 10 calendar days
        - combine as `include=series,intraday`
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: krs
        in: path
        required: true
        schema:
          type: string
        description: KRS input is normalized by stripping non-digits and left-padding to 10 digits.
        example: "0000028860"
      - name: include
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated extras. Supported values `series`, `intraday`.
        example: series
      - name: series_limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 2000
          default: 250
        description: Daily bars when `include` contains `series`. Ignored otherwise.
      responses:
        '200':
          description: Listing snapshot (`gpw` may be null).
          content:
            application/json:
              schema:
                type: object
              example:
                krs: "0000028860"
                entity_id: ad2ae683-ccbd-49c6-a85c-648024435cb5
                nip: "7740001454"
                gpw:
                  ticker: PKN
                  isin: PLPKN0000018
                  market: main
                  last_close: 78.12
                  last_close_date: "2026-09-01"
                  pe_ratio: 9.29
                  currency: PLN
                  delayed_minutes: 15
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
