    PersonConnectionsResponse:
      type: object
      required:
      - person_id
      - companies
      properties:
        person_id:
          type: string
          format: uuid
        companies:
          type: array
          items:
            type: object
            required:
            - entity_id
            - relationships
            properties:
              entity_id:
                type: string
                format: uuid
              registry_number:
                type: string
                nullable: true
                description: KRS number (10 digits), if available.
              company_name:
                type: string
                nullable: true
              relationships:
                type: array
                items:
                  type: object
                  required:
                  - kind
                  - role
                  properties:
                    kind:
                      type: string
                      description: Relationship type (e.g. `management`, `ownership`).
                    role:
                      type: string
                      nullable: true
                      description: Role label (e.g. `PREZES ZARZĄDU`), if available.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional idempotency key (1-255 characters, e.g. a UUID). Watchlist writes are keyed by KRS,
        so repeating the same request — with or without this header — never creates a duplicate entry.
        The key is echoed back in the `Idempotency-Key` response header.
      schema:
        type: string
        maxLength: 255
      example: 3f6c2a4e-8d1b-4c39-9f2e-1a7b5d0e9c41
    DryRun:
      name: dry_run
      in: query
      required: false
      description: |
        When `true`, the request is validated (key, KRS, plan limits) and the response says what
        would happen (`would_add` / `would_remove`), but nothing is written and no webhook fires.
      schema:
        type: boolean
        default: false
    CompanyFilterQ:
      name: q
      in: query
      description: 'Free-text search (company name and identifiers). **Digits** are treated as a possible KRS/NIP/REGON

        lookup. Whitespace is trimmed.

        Matching strategy:
        - identifier-like numeric input: identifier lookup path is used first.
          For 10-digit numeric values, exact match is attempted against KRS (`registry_number`) and NIP;
          an exact match is also attempted against REGON as stored in the index.
          For other numeric lengths, prefix matching is used for those identifier fields.
        - textual input: case-insensitive substring match on company name (`ILIKE %q%`).

        Numeric lookup has priority over text-name matching when `q` contains only digits.
        Example: `q=0000028860` is treated as identifier lookup (not generic relevance search).

        '
      schema:
        type: string
      example: orlen
    CompanyFilterKeywords:
      name: keywords
      in: query
      description: 'Keyword filter with **OR** semantics. Pass a comma-separated list, or repeat the parameter.

        Each keyword must be at least **2** characters after trimming.
        Empty tokens are ignored.
        Duplicate tokens may appear and are not guaranteed to be deduplicated server-side.
        Mixing repeated params and CSV is supported (e.g. `keywords=a,b&keywords=c`).

        '
      schema:
        type: string
      example: logistics,energy
    CompanyFilterLimit:
      name: limit
      in: query
      description: 'Page size. **Default:** `20`. `GET /companies` caps at **100** per request.

        For bulk pulls use `GET /companies/export` (or `limit` &gt; 100 on `/companies` via API key),
        capped at **500** per page. For deep traversal, page with `cursor`.

        **Quota accounting:** monthly quota counts each HTTP request. Row count in the page does not change the cost.
        Example: `limit=500` still consumes **1** request from monthly quota.

        '
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 500
    CompanyFilterOffset:
      name: offset
      in: query
      description: 'Zero-based row offset for classic **offset** pagination.

        Client contract: use either `offset` or `cursor` (not both).
        If both are provided, the server returns `400 CONFLICTING_PARAMETERS`.

        '
      schema:
        type: integer
        default: 0
        minimum: 0
    CompanyFilterCursor:
      name: cursor
      in: query
      description: 'Optional **cursor** for pagination: `entity_id` of the last row from the previous page.

        Cursor paging is ordered by `entity_id` ascending. Use it for deep paging/export-style traversal.
        Do not combine with `offset`; if both are sent, request fails with `400 CONFLICTING_PARAMETERS`.

        When present, the server may return `pagination.total: -1` and include `pagination.cursor` for the next page.

        '
      schema:
        type: string
        format: uuid
    CompanyFilterPkd:
      name: pkd
      in: query
      description: 'PKD code (Polish business activity classification). **Case-insensitive**; trimmed and uppercased server-side.

        By default only the **primary** PKD (`primary_only=true`) is matched; set `primary_only=false` to match any code in
        `all_pkd_codes`.

        '
      schema:
        type: string
      example: '62.01'
    CompanyFilterPrimaryOnly:
      name: primary_only
      in: query
      description: 'Boolean filter syntax is accepted (`true`/`false`).

        Semantics: `true` (default) means `pkd` matches `primary_pkd` only.
        `false` means `pkd` can match any entry in `all_pkd_codes`.

        '
      schema:
        type: boolean
        default: true
    CompanyFilterCurrency:
      name: currency
      in: query
      description: 'Display/filter currency context for financial threshold filters.

        Allowed values: `PLN`, `USD`, `EUR` (case-insensitive).
        Default is `PLN`.

        For `revenue_min` / `revenue_max`, the API applies thresholds against:
        - `revenue_total` when `currency=PLN`
        - `revenue_total_usd` when `currency=USD`
        - `revenue_total_eur` when `currency=EUR`

        '
      schema:
        type: string
        enum: [PLN, USD, EUR]
        default: PLN
    CompanyFilterVoivodeship:
      name: voivodeship
      in: query
      description: 'Voivodeship / region filter. Compared to `company_search.region` **case-insensitively** (lowercased on
        the server).

        Use the same spelling as stored in data (e.g. Polish voivodeship names such as `mazowieckie`, `śląskie`).
        Common values include: `dolnośląskie`, `małopolskie`, `mazowieckie`, `pomorskie`, `śląskie`, `wielkopolskie`.

        '
      schema:
        type: string
      example: mazowieckie
    CompanyFilterPostalCode:
      name: postal_code
      in: query
      description: 'Exact postal code match (trimmed). Format depends on source data (e.g. `00-001`).

        '
      schema:
        type: string
    CompanyFilterCity:
      name: city
      in: query
      description: 'City substring filter (case-insensitive **ILIKE** `%city%`).

        '
      schema:
        type: string
      example: Warszawa
    CompanyFilterRevenueMin:
      name: revenue_min
      in: query
      description: 'Minimum **total revenue** (`revenue_total`).

        Currency depends on `currency` query param (`PLN`/`USD`/`EUR`).
        If `currency` is omitted, PLN is used.
        Values are in **full currency units** (not thousands), e.g. `1000000` = one million PLN.
        Evaluated against the latest indexed financial snapshot per company.
        Companies with `null` in the selected revenue column do not match this filter.

        '
      schema:
        type: number
    CompanyFilterRevenueMax:
      name: revenue_max
      in: query
      description: 'Maximum **total revenue** threshold in full units.

        Currency depends on `currency` query param (`PLN`/`USD`/`EUR`).
        If `currency` is omitted, PLN is used.

        If `revenue_min > revenue_max`, the API returns `400` with code `INVALID_RANGE`.
        Evaluated against the latest indexed financial snapshot per company.
        Companies with `null` in the selected revenue column do not match this filter.

        '
      schema:
        type: number
    CompanyFilterRevenueOperatingMin:
      name: revenue_operating_min
      in: query
      description: Minimum operating revenue (net sales / operating revenue field from financials).
      schema:
        type: number
    CompanyFilterRevenueOperatingMax:
      name: revenue_operating_max
      in: query
      schema:
        type: number
    CompanyFilterProfitOperatingMin:
      name: profit_operating_min
      in: query
      schema:
        type: number
    CompanyFilterProfitOperatingMax:
      name: profit_operating_max
      in: query
      schema:
        type: number
    CompanyFilterProfitNetMin:
      name: profit_net_min
      in: query
      schema:
        type: number
    CompanyFilterProfitNetMax:
      name: profit_net_max
      in: query
      schema:
        type: number
    CompanyFilterIncomeTaxMin:
      name: income_tax_min
      in: query
      schema:
        type: number
    CompanyFilterIncomeTaxMax:
      name: income_tax_max
      in: query
      schema:
        type: number
    CompanyFilterCostWagesMin:
      name: cost_wages_min
      in: query
      schema:
        type: number
    CompanyFilterCostWagesMax:
      name: cost_wages_max
      in: query
      schema:
        type: number
    CompanyFilterCostAmortizationMin:
      name: cost_amortization_min
      in: query
      schema:
        type: number
    CompanyFilterCostAmortizationMax:
      name: cost_amortization_max
      in: query
      schema:
        type: number
    CompanyFilterTotalAssetsMin:
      name: total_assets_min
      in: query
      schema:
        type: number
    CompanyFilterTotalAssetsMax:
      name: total_assets_max
      in: query
      schema:
        type: number
    CompanyFilterEbitdaMin:
      name: ebitda_min
      in: query
      schema:
        type: number
    CompanyFilterEbitdaMax:
      name: ebitda_max
      in: query
      schema:
        type: number
    CompanyFilterCapitalMin:
      name: capital_min
      in: query
      description: Minimum **share capital** (`capital_total`).
      schema:
        type: number
    CompanyFilterCapitalMax:
      name: capital_max
      in: query
      schema:
        type: number
    CompanyFilterEstimatedValueMin:
      name: estimated_value_min
      in: query
      description: Minimum **estimated company value** (`estimated_value`), when present in search index.
      schema:
        type: number
    CompanyFilterEstimatedValueMax:
      name: estimated_value_max
      in: query
      schema:
        type: number
    CompanyFilterRegistrationYearMin:
      name: registration_year_min
      in: query
      description: 'Earliest **registration** year (`registration_date` filter): companies registered on or after `YYYY-01-01`.

        '
      schema:
        type: integer
      example: 2015
    CompanyFilterRegistrationYearMax:
      name: registration_year_max
      in: query
      description: Latest registration year (`registration_date` on or before `YYYY-12-31`).
      schema:
        type: integer
    CompanyFilterRegistrationDateMin:
      name: registration_date_min
      in: query
      description: 'Earliest exact **registration date** (`registration_date` on or after this day, inclusive), format `YYYY-MM-DD`.
        Takes precedence over `registration_year_min`. For companies registered today, pass today''s date as both
        `registration_date_min` and `registration_date_max`. Applies to KRS companies and to JDG (CEIDG) rows merged into browse results.

        '
      schema:
        type: string
        format: date
      example: '2026-10-07'
    CompanyFilterRegistrationDateMax:
      name: registration_date_max
      in: query
      description: Latest exact registration date (`registration_date` on or before this day, inclusive), format `YYYY-MM-DD`. Takes precedence over `registration_year_max`.
      schema:
        type: string
        format: date
      example: '2026-10-07'
    CompanySort:
      name: sort
      in: query
      description: 'Sort the result set by one column (default: completeness / revenue ranking). Rows without a value in that
        column are excluded while sorting. Text columns (`name`, `nip`, `regon`, `city`, `region`, `postal_code`) sort alphabetically;
        `registration_date` with `dir=desc` lists the newest registrations first (future-dated register errors are skipped);
        `revenue_growth` with `dir=desc` lists the fastest-growing companies (y/y revenue growth in %, latest vs previous
        financial year from KRS statements; combine with `revenue_min` to skip small companies).
        Not applied to free-text (`q`) or `keywords` searches, which keep relevance order.

        '
      schema:
        type: string
        enum: [revenue, profit_net, estimated_value, total_assets, operating_costs_total, fixed_assets, current_assets, equity, liabilities_and_provisions, capital, registration_date, revenue_growth, name, nip, regon, city, region, postal_code]
      example: registration_date
    CompanySortDir:
      name: dir
      in: query
      description: Sort direction for `sort` (`asc` or `desc`, default `desc`).
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    CompanyFilterLastReportYearMin:
      name: last_report_year_min
      in: query
      description: 'Earliest **financial report period** (`financial_period_to` on or after `YYYY-01-01`).

        When combined with financial metric filters, both are evaluated against the same indexed reporting snapshot.

        '
      schema:
        type: integer
    CompanyFilterLastReportYearMax:
      name: last_report_year_max
      in: query
      description: 'Latest financial report period (`financial_period_to` on or before `YYYY-12-31`).

        When combined with financial metric filters, both are evaluated against the same indexed reporting snapshot.

        '
      schema:
        type: integer
    CompanyFilterStatusActive:
      name: status_active
      in: query
      description: 'Boolean filter syntax is accepted (`true`/`false`).

        Semantics: `true` applies positive filter (only active companies).
        `false` is syntactically valid and treated as no filter.

        '
      schema:
        type: boolean
    CompanyFilterLegalForm:
      name: legal_form
      in: query
      description: 'Legal form substring filter (case-insensitive **ILIKE** `%legal_form%`).

        Common values/phrases:
        `spółka z ograniczoną odpowiedzialnością`, `spółka akcyjna`, `prosta spółka akcyjna`,
        `spółka komandytowa`, `jednoosobowa działalność gospodarcza`.

        '
      schema:
        type: string
      example: spółka akcyjna
    CompanyFilterHasEmail:
      name: has_email
      in: query
      description: 'Boolean filter syntax is accepted (`true`/`false`).

        Semantics: `true` applies positive filter (only companies with email).
        `false` is syntactically valid and treated as no filter.

        '
      schema:
        type: boolean
    CompanyFilterHasWebsite:
      name: has_website
      in: query
      description: 'Boolean filter syntax is accepted (`true`/`false`).

        Semantics: `true` applies positive filter (only companies with website).
        `false` is syntactically valid and treated as no filter.

        '
      schema:
        type: boolean
