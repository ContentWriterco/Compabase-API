openapi: 3.1.0
info:
  title: Compabase API
  version: 1.0.0
  description: |
    ### Introduction
    Versioned JSON API for Polish company data: KRS search and full profiles, CEIDG (sole
    proprietors) by NIP, financial statements and document inventory, peer statistics,
    company connections, news/UGC, Warsaw Stock Exchange (GPW) listings, and watchlist management.

    ### Base URL
    `https://compabase.com/api/v1/`

    ### Authentication
    Send your key in header `X-API-Key: <key>` or `Authorization: Bearer <key>`.

    API keys are self-service: create a free account, then generate and manage your keys in the
    <a href="/api-keys" target="_blank" rel="noopener noreferrer">API key dashboard</a>.
    Usage is billed according to your plan. See the
    <a href="/pricing" target="_blank" rel="noopener noreferrer">pricing page</a> for details.

    Authenticated requests return **contact email** on company profiles and search rows when
    available (same data as the logged-in web UI). Public unauthenticated site pages still gate emails.

    ### Error Model
    `{ "statusCode": 400, "statusMessage": "...", "message": "...", "data": { "error": { "code": "...", "message": "...", "details": { ... } } } }`

    The outer envelope (`statusCode`, `statusMessage`, `message`) is set by the Nitro server framework.
    The domain error object lives under `data.error` with a machine-readable `code`, a human-readable
    `message`, and optional `details`.

    ### Validation Rules
    - invalid numeric ranges (`*_min > *_max`) -> `400 INVALID_RANGE`
    - invalid booleans (`primary_only`, `has_email`, `has_website`, `status_active`) -> `400 INVALID_BOOLEAN`
    - invalid cursor UUID -> `400 INVALID_CURSOR`
    - invalid KRS format -> `400 INVALID_KRS`
    - invalid NIP format -> `400 INVALID_NIP`
    - too-short keyword token (<2 chars) -> `400 INVALID_KEYWORDS`
    - mutually exclusive parameters supplied together (e.g. `cursor` and `offset`) -> `400 CONFLICTING_PARAMETERS`

    ### Quota Accounting
    Each key is tied to your account plan and has a monthly `api_requests` limit that resets
    with the UTC calendar month (see `GET /usage` for `monthUtc` / `resetsAtUtc`). Limits by
    plan: Free 100, Pro 5 000, Scale 100 000, Enterprise – custom.

    - quota is consumed by authenticated `/api/v1` requests, except `GET /usage`
    - requests that fail before authentication succeeds (`401`) do not consume quota
    - requests rejected because quota is already exhausted (`429`) do not consume additional quota
    - other authenticated responses, including `200`, `400`, and `404`, consume quota

    ### Bulk pulls
    Use `GET /companies/export` (or `GET /companies` with `limit` up to **500**) plus cursor
    pagination (`cursor` = last `entity_id`) to enrich large lists. Each page consumes **one**
    `api_requests` unit – not the portal/MCP `export_companies` meter. For a full profile,
    call `GET /companies/krs/{krs}` once per company.

