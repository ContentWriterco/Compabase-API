        dry_run:
          type: boolean
          description: Present and `true` only for `dry_run=true` requests — nothing was written.
        would_add:
          type: boolean
          description: Only with `dry_run=true` — whether a real request would add the company.
    PersonSearchItem:
      type: object
      required:
      - person_id
      - display_name
